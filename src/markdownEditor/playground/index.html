<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Editor Playground</title>
    <link rel="stylesheet" href="./theme.css" />
</head>
<body class="vscode-dark markdown-playground">
    <div id="toolbar">
        <label for="fixture">Fixture</label>
        <select id="fixture"></select>
    </div>
    <div id="workspace">
        <aside id="source-inspector" aria-label="Markdown source">
            <div id="source-status">
                <p class="source-heading">Active block</p>
                <p id="source-selection-label">No active block</p>
                <div id="source-selection-blocks" hidden></div>
                <p class="source-heading">Last edit</p>
                <p id="source-edit-label">No edits yet</p>
                <p id="source-edit-deleted-label" class="source-subheading" hidden>Deleted</p>
                <pre id="source-edit-deleted" hidden></pre>
                <p id="source-edit-inserted-label" class="source-subheading" hidden>Inserted</p>
                <pre id="source-edit-inserted" hidden></pre>
            </div>
            <div id="source-scroller">
                <pre id="source-gutter" aria-hidden="true"></pre>
                <pre id="source-text"><span id="source-caret" hidden></span></pre>
            </div>
        </aside>
        <div id="workspace-split" role="separator" aria-orientation="vertical" aria-label="Resize source and preview" tabindex="0"></div>
        <div id="editor"></div>
    </div>
    <script type="module" src="./main.ts"></script>
</body>
</html>
